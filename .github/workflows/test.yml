name: Windows regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise CLI and native GUI with fixtures and repair previews
        shell: ${{ matrix.shell }}
        run: .\tests\Test-All.ps1
